# QuantForge local dev stack. Frontend is intentionally absent until Phase 5.
# `version:` is omitted (obsolete under Compose v2).

services:
  timescaledb:
    image: timescale/timescaledb:2.30.2-pg16   # pinned (was a TODO since Phase 1); the Alembic
      # hypertable migration has been stable for months, so a floating `latest-pg16` tag buys
      # nothing but a reproducibility risk. Verified this tag exists and was published at the
      # exact same instant as `latest-pg16` (2026-09-29, hub.docker.com API), so it is the
      # identical image, not a downgrade.
    environment:
      POSTGRES_USER: quantforge
      POSTGRES_PASSWORD: password
      POSTGRES_DB: quantforge
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantforge -d quantforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://quantforge:password@timescaledb:5432/quantforge  # sync, ADR-009
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      # docker-compose has the real DB; flip the runtime to use it. Standalone `uvicorn`
      # (no docker) leaves this unset and falls through to the in-memory default.
      STORAGE_BACKEND: timescale
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  timescale_data:
