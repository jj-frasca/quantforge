name: pre-commit

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: this workflow only reads the repo and runs hooks, never writes back.
permissions:
  contents: read

# Cancel superseded runs on the same ref (matches ci.yml's policy).
concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Report Python environment
        run: python -m pip freeze --local
      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run all hooks
        run: pre-commit run --show-diff-on-failure --color=always --all-files
