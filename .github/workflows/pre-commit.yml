name: pre-commit

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: this workflow only reads the repo and runs hooks, never writes back.
permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
