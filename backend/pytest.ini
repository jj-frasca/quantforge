[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts = --strict-markers --strict-config -ra --timeout=300 --timeout-method=thread

# A hung test must fail by name, not stall the run. `make check` on a dev machine sat for 70
# minutes on one pegged worker with no way to tell which test it was, twice, while the same suite
# finished on CI in under nine minutes. 300s is ~35x the slowest legitimate test and well inside
# CI's own budget, so this only ever fires on a hang. `thread` is the method that works under
# pytest-xdist; `signal` does not fire in a worker process.

# Markers. `live` hits real external APIs (e.g. yfinance) — non-deterministic and
# rate-limited, so it is EXCLUDED from CI (`make test` runs -m "not live").
# Run it locally with `make test-live`. See ARCHITECTURE.md §0.5 (CI gating).
markers =
    live: test depends on a live external data source (run locally via `make test-live`)
    integration: spans multiple components / requires services (DB, Redis)
    e2e: full end-to-end flow
